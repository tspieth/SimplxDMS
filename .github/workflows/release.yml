name: Build Installers

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            type: msi
          - os: macos-latest
            type: dmg
          - os: ubuntu-latest
            type: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR mit Maven
        run: mvn clean package

      - name: JAR-Dateiname ermitteln
        id: jarname
        shell: bash
        run: |
          JAR_FILE=$(ls target/*.jar | grep -v original | head -n 1)
          echo "jar=$(basename "$JAR_FILE")" >> "$GITHUB_OUTPUT"

      - name: Installer mit jpackage bauen
        shell: bash
        run: |
          jpackage --input target/ \
            --name MeineApp \
            --main-jar ${{ steps.jarname.outputs.jar }} \
            --main-class gui.Main \
            --type ${{ matrix.type }} \
            --app-version 1.0 \
            --vendor "Timon Spieth" \
            --dest dist/

      - name: Installer zum Release hochladen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*