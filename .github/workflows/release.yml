name: Build Installers

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            type: msi
            args: >-
              --win-shortcut --win-menu --win-menu-group SimplxDMS --win-dir-chooser
              --win-upgrade-uuid 8D472F4A-8A74-4F6A-9B9A-0C4A0B1D7E21
              --icon src/main/resources/icons/app.ico
          - os: ubuntu-latest
            type: deb
            args: >-
              --linux-shortcut --linux-menu-group Office
              --icon src/main/resources/icons/app.png
          - os: macos-latest
            type: dmg
            args: >-
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR mit Maven
        run: mvn clean package

      - name: JAR-Dateiname ermitteln
        id: jarname
        shell: bash
        run: |
          JAR_FILE=$(ls target/*.jar | grep -v original | head -n 1)
          echo "jar=$(basename "$JAR_FILE")" >> "$GITHUB_OUTPUT"

      - name: Installer mit jpackage bauen
        shell: bash
        run: |
          jpackage --input target/ \
            --name SimplxDMS \
            --main-jar ${{ steps.jarname.outputs.jar }} \
            --main-class gui.Launcher \
            --type ${{ matrix.type }} \
            --app-version 1.0.0 \
            --vendor "Timon Spieth" \
            ${{ matrix.args }} \
            --dest dist/

      - name: Installer zum Release hochladen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*